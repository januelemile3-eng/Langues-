<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Langues">
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Langues</title>
<style>
:root{--bg:#f6f7fb;--fg:#14213d;--card:#fff;--mut:#6b7280;--ok:#1b8a5a;--ko:#c0392b;--wait:#b7791f;--btn:#fca311}
@media (prefers-color-scheme:dark){:root{--bg:#0d1321;--fg:#eef1f8;--card:#18213a;--mut:#9aa5bd;--ok:#4cc38a;--ko:#ff7a6b;--wait:#f0b44c}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.45 -apple-system,system-ui,sans-serif}
main{padding:calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 28px);max-width:520px;margin:0 auto}
h1{font-size:28px;margin:0 0 4px}
p.sub{color:var(--mut);margin:0 0 20px}
button{font:600 17px -apple-system,system-ui,sans-serif;width:100%;padding:15px;border:0;border-radius:14px;background:var(--btn);color:#14213d;margin-bottom:10px}
button.sec{background:var(--card);color:var(--fg)}
button:active{opacity:.7}
.row{background:var(--card);border-radius:14px;padding:12px 16px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.row b{flex:0 0 auto}
.row small{display:block;color:var(--mut);font-size:14px}
.ok{color:var(--ok)}.ko{color:var(--ko)}.wait{color:var(--wait)}
p.note{color:var(--mut);font-size:14px;margin-top:16px}
</style>
</head>
<body>
<main>
  <h1>Langues</h1>
  <p class="sub">Étape 2 : la mémoire de l'app</p>
  <button id="go">Lancer le test de la mémoire</button>
  <button id="exp" class="sec">Tester la sauvegarde (export)</button>
  <div id="out"></div>
  <p class="note">Cette page de test disparaîtra à l'étape 3. Le test n'efface rien de réel et rien ne quitte ton téléphone.</p>
</main>
<script src="db.js"></script>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
var out=document.getElementById('out');
function line(ok,title,detail){
  var d=document.createElement('div');d.className='row';
  d.innerHTML='<b class="'+(ok===null?'wait':ok?'ok':'ko')+'">'+(ok===null?'…':ok?'✓':'✗')+'</b><div>'+title+(detail?'<small>'+detail+'</small>':'')+'</div>';
  out.appendChild(d);
}
function must(c,m){if(!c)throw new Error(m)}
window.addEventListener('db-error',function(e){line(false,'Erreur de stockage',String(e.detail&&e.detail.message||e.detail))});

document.getElementById('go').onclick=async function(){
  out.innerHTML='';var T='_test';
  try{
    await DB.open();line(true,'Mémoire ouverte');
    await DB.purgeLang(T);
    var p=await DB.getProfile(T);await DB.addXP(T,10);await DB.touchStreak(T);
    p=await DB.getProfile(T);
    must(p.xp===10&&p.streak===1,'Profil incorrect');
    line(true,'Profil, XP et série de jours','10 XP et série de 1 jour relus correctement');
    for(var i=1;i<=3;i++)await DB.add('attempts',{lang:T,lessonId:'L1',blockId:'B1',exerciseId:'E'+i,correct:i!==2,answer:'test',ms:1200+i,ts:Date.now()});
    var at=await DB.byIndex('attempts','lang',T);
    must(at.length===3,'Réponses manquantes');
    line(true,'Journal des réponses','3 réponses enregistrées et retrouvées');
    await DB.batch(['blocks','lessons'],function(s){
      s.blocks.put({id:'B1',lang:T,index:1,status:'ready',createdAt:Date.now()});
      s.lessons.put({id:'L1',lang:T,blockId:'B1',order:1,status:'ready',exercises:[]});
    });
    var b=await DB.get('blocks','B1'),l=await DB.byIndex('lessons','blockId','B1');
    must(b&&l.length===1,'Bloc de leçons manquant');
    line(true,'Bloc de leçons hors-ligne','Bloc et leçon sauvegardés ensemble, d\'un seul coup');
    var ex=await DB.exportAll(),size=Math.round(JSON.stringify(ex).length/1024*10)/10;
    must(ex.data.attempts.some(function(a){return a.lang===T}),'Export incomplet');
    line(true,'Sauvegarde complète','Export prêt (' + size + ' Ko)');
    await DB.purgeLang(T);
    var rest=await DB.byIndex('attempts','lang',T);
    must(rest.length===0&&!(await DB.get('profiles',T)),'Nettoyage incomplet');
    line(true,'Nettoyage des données de test');
    var per=await DB.persist(),est=await DB.estimate();
    line(per?true:null,'Protection contre l\'effacement',per?'Safari gardera tes données':'Standard (installe l\'app sur l\'écran d\'accueil)');
    if(est)line(true,'Espace disponible',Math.round(est.quota/1048576)+' Mo possibles, '+Math.round((est.usage||0)/1024)+' Ko utilisés');
    line(true,'TOUT EST BON','La mémoire fonctionne');
  }catch(e){line(false,'Échec du test',String(e.message||e))}
};
document.getElementById('exp').onclick=async function(){
  try{
    var data=await DB.exportAll(),txt=JSON.stringify(data,null,1);
    var f=new File([txt],'sauvegarde-langues.json',{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});line(true,'Sauvegarde partagée')}
    else{var a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click();line(true,'Sauvegarde téléchargée')}
  }catch(e){line(e&&e.name==='AbortError'?null:false,'Sauvegarde',e&&e.name==='AbortError'?'Annulée':String(e.message||e))}
};
</script>
</body>
</html>
